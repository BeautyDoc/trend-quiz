/* Rebuilds the chart named by the start screen's replay field as a
   standalone practice round. The candles are rebuilt with the
   settings encoded in the ID, so the chart itself is the exact one
   the ID names; the round is then SHOWN in the style picked on the
   start screen, which may differ — pick Line before replaying a
   candle chart and you get that same chart as a line, judged by the
   closes-only Line analysis (which can disagree with the candle
   verdict, by design). Picking the style the chart was made in
   replays it exactly as first seen. (Before this split existed, the
   ID's style silently overrode the start-screen pick, so asking for
   a Line view of a candle chart just showed the candles again.) */
function startReplay() {
  var spec = decodeChartId(document.getElementById("replayIn").value);
  var err = document.getElementById("replayErr");
  if (!spec) {
    err.textContent = "That doesn't look like a chart ID — it should be the 6 characters shown under the question number, like a3f9k2.";
    err.hidden = false;
    return;
  }
  err.hidden = true;
  /* The display style for the round is the one currently picked:
     CANDLE_STYLE already holds it (Expert picks display as the
     Realistic charts they are played on). Generation below runs
     under the ID's own settings; the pick is restored right after,
     before anything renders. */
  var viewStyle = CANDLE_STYLE;
  INCLUDE_GAPS = spec.gaps;
  CANDLE_STYLE = spec.style;
  var chart = genQuestion(spec.target, spec.seed);
  CANDLE_STYLE = viewStyle;
  if (viewStyle === "line") {
    /* Same candles, closes-only reading: every generated chart
       carries its Line analysis alongside the candle one. */
    chart.result = chart.resultLine;
  } else if (spec.style === "line") {
    /* Generated under Line, which keeps only the Line reading as
       chart.result — re-derive the candle reading of the same
       candles for the candle display. */
    chart.result = analyze(chart);
  }
  quiz = { questions: [chart], idx: 0, answers: [null], mode: "replay" };
  renderQuestion();
}

function newSet() {
  var up = randi(2, 5);
  var down = randi(2, Math.min(5, 9 - up));
  var targets = [];
  var i;
  for (i = 0; i < up; i++) targets.push("up");
  for (i = 0; i < down; i++) targets.push("down");
  while (targets.length < 10) targets.push("consolidation");
  shuffle(targets);
  /* genQuestion must be called with ONLY the target: passing it straight
     to targets.map would also hand it the element index, which it would
     take for the seed — every set would then rebuild the same handful of
     charts. Called bare, each question draws a fresh random seed, while
     genQuestion(target, seed) still rebuilds a chart exactly for replay. */
  var questions = targets.map(function (t) { return genQuestion(t); });
  quiz = { questions: questions, idx: 0, answers: questions.map(function () { return null; }), mode: "quiz" };
  renderQuestion();
}

function renderQuestion() {
  var q = quiz.questions[quiz.idx];
  rememberChart(q.chartId);
  var review = quiz.mode === "review";
  var replay = quiz.mode === "replay";
  answered = review;
  bd = null;
  closeStepThrough();
  var idHtml = q.chartId ? '<span class="idwrap"><span class="chartid">Chart #' + q.chartId + "</span>" +
    '<button type="button" class="copyid" data-copyid="' + q.chartId + '" title="Copy chart number" ' +
    'aria-label="Copy chart number ' + q.chartId + '">' + COPY_ICON + "</button></span>" : "";
  /* The way home stands in the top bar itself, on every variant of
     this screen — question, answered (the bar persists above the
     feedback), review and the replay round — visible without
     scrolling. Start-screen controls come at most in pairs, at
     opposite ends of a screen, never two in one row cluster: quiz
     and review screens pair this one with the last row's button;
     the replay round pairs it with the answered view's primary
     "Back to start" instead. */
  var topHome = '<button class="btn topback" id="topHomeBtn">Back to start</button>';
  var head;
  if (review) {
    head = '<div class="topbar"><span class="prog">Reviewing Question ' + (quiz.idx + 1) + "</span>" + idHtml +
      '<span class="score">From your last set</span>' + topHome + "</div>";
  } else if (replay) {
    head = '<div class="topbar"><span class="prog">Replay — practice round</span>' + idHtml + topHome + "</div>";
  } else {
    head = '<div class="topbar"><span class="prog">Question ' + (quiz.idx + 1) + " of 10</span>" + idHtml +
      '<span class="score">Score: ' + scoreSoFar() + "</span>" + topHome + "</div>" +
      '<div class="bar"><div style="width:' + (quiz.idx * 10) + '%"></div></div>';
  }
  app.innerHTML = head +
    '<div class="card">' +
    '<div id="chartbox">' + chartSVG(q, { bare: true }) + "</div>" +
    '<p class="small">Drag across the chart — a cursor follows, naming the candle under it and the exact price at that height.</p>' +
    '<p class="qtext">What state is the market in at the end of this chart?</p>' +
    '<div class="answers">' +
    '<button class="ans-btn" data-a="up">Uptrend</button>' +
    '<button class="ans-btn" data-a="down">Downtrend</button>' +
    '<button class="ans-btn" data-a="consolidation">Consolidation</button>' +
    "</div>" +
    '<div id="feedback"></div><div id="bdbox"></div>' +
    "</div>" +
    '<div class="row"><button class="btn" data-rules>Rules</button>' +
    /* Start-screen controls stand at opposite ends of the screen and
       nowhere else: the top bar carries one, this last row carries
       the other — except in the replay round, whose answered view
       ends on a primary "Back to start" in the feedback row just
       above this one, so there the top-bar button stands alone
       rather than a third stacking within arm's reach of it. */
    (replay ? "" : '<button class="btn" id="homeBtn">Back to start</button>') +
    (review ? "" : '<a class="btn" data-dl download="trend-quiz.html">Download a standalone copy</a>') + "</div>";
  var homeBtnEl = document.getElementById("homeBtn");
  if (homeBtnEl) homeBtnEl.addEventListener("click", function () { renderIntro(); });
  document.getElementById("topHomeBtn").addEventListener("click", function () { bd = null; renderIntro(); });
  var btns = app.querySelectorAll(".ans-btn");
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function () { onAnswer(this.getAttribute("data-a")); });
  }
  bindDownloads();
  bindRulesButtons();
  bindChartCursors();
  if (review) showFeedback(quiz.answers[quiz.idx] ? quiz.answers[quiz.idx].pick : q.result.answer, true);
}

function onAnswer(pick) {
  if (answered) return;
  answered = true;
  var q = quiz.questions[quiz.idx];
  if (!quiz.answers[quiz.idx]) {
    quiz.answers[quiz.idx] = { pick: pick, correct: pick === q.result.answer };
  }
  showFeedback(pick, false);
}

function showFeedback(pick, isReview) {
  var q = quiz.questions[quiz.idx];
  var ans = q.result.answer;
  /* Answering reveals the full markup: control lines, control circles,
     labels and the segment overlay. */
  var cb = document.getElementById("chartbox");
  if (cb) cb.innerHTML = chartSVG(q, { lines: q.result.finalLines, highlight: q.result.lastBreakIdx,
    activeLegs: activeLegsAt(q.result, q.result.swings, q.candles.length - 1) });
  var correct = pick === ans;
  var btns = app.querySelectorAll(".ans-btn");
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i], a = b.getAttribute("data-a");
    b.disabled = true;
    b.classList.toggle("correct", a === ans);
    b.classList.toggle("wrong", a === pick && !correct);
  }
  var last = quiz.idx === quiz.questions.length - 1;
  var replay = quiz.mode === "replay";
  var html = '<div class="feedback">' +
    '<p class="verdict ' + (correct ? "ok" : "no") + '">' +
    (isReview
      ? "The answer is " + stateName(ans) + "."
      : correct ? "Correct — " + stateName(ans) + "." : "Not quite — the answer is " + stateName(ans) + ".") +
    "</p>" +
    '<p class="explain">' + esc(q.result.explanation) + "</p>" +
    '<div class="row">' +
    '<button class="btn" id="bdBtn">Segment Summary</button>' +
    '<button class="btn" id="stBtn">Control-point replay</button>' +
    INFO_BTN;
  if (!correct && !isReview) html += '<button class="btn" id="againBtn">Try again on this chart</button>';
  /* No start-screen button lives in this action row: the answered
     view already has one at each end of the screen — the top bar's
     and the last row's, beside Rules — and one here stood directly
     on top of the last row's, two in a row. The replay round is the
     exception by design: its primary button below IS the way back,
     labelled "Back to start" (and its screen omits the last-row
     button, so the pair never stacks there either). */
  if (isReview) html += '<button class="btn primary" id="nextBtn">Back to results</button>';
  else if (replay) html += '<button class="btn primary" id="nextBtn">Back to start</button>';
  else html += '<button class="btn primary" id="nextBtn">' + (last ? "See results" : "Next question") + "</button>";
  html += "</div></div>";
  document.getElementById("feedback").innerHTML = html;
  document.getElementById("bdBtn").addEventListener("click", openBreakdown);
  document.getElementById("stBtn").addEventListener("click", openStepThrough);
  bindLegendButtons();
  var again = document.getElementById("againBtn");
  if (again) again.addEventListener("click", tryAgain);
  document.getElementById("nextBtn").addEventListener("click", function () {
    if (replay) { renderIntro(); return; }
    if (isReview) { renderResults(); return; }
    if (last) { renderResults(); } else { quiz.idx++; renderQuestion(); }
  });
  bindChartCursors();
}

function tryAgain() {
  answered = false;
  bd = null;
  closeStepThrough();
  document.getElementById("bdbox").innerHTML = "";
  document.getElementById("feedback").innerHTML = "";
  var cb = document.getElementById("chartbox");
  if (cb) cb.innerHTML = chartSVG(quiz.questions[quiz.idx], { bare: true });
  var btns = app.querySelectorAll(".ans-btn");
  for (var i = 0; i < btns.length; i++) {
    btns[i].disabled = false;
    btns[i].classList.remove("correct", "wrong");
  }
  bindChartCursors();
}

/* ---------------- Segment Summary slideshow ---------------- */
function openBreakdown() {
  closeStepThrough();
  bd = { step: 0 };
  renderBreakdown();
  var el = document.getElementById("bdbox");
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function renderBreakdown() {
  var q = quiz.questions[quiz.idx];
  var steps = q.result.steps;
  var st = steps[bd.step];
  var box = document.getElementById("bdbox");
  box.innerHTML =
    '<div class="feedback"><div class="bd-head"><h2>Segment Summary</h2>' +
    '<span class="bd-step">Step ' + (bd.step + 1) + " of " + steps.length + "</span></div>" +
    '<p class="sub">The summary \u2014 how the trend was built, one segment at a time, everything as it finally stood.</p>' +
    /* Controls above the chart and caption, as in the candle replay:
       the caption's length changes from step to step, and the buttons
       must not ride up and down with it. */
    '<div class="row">' +
    '<button class="btn" id="bdPrev"' + (bd.step === 0 ? " disabled" : "") + ">Previous</button>" +
    '<button class="btn" id="bdNext"' + (bd.step === steps.length - 1 ? " disabled" : "") + ">Next step</button>" +
    '<button class="btn" id="bdClose">Close Segment Summary</button>' +
    INFO_BTN +
    '<button class="btn" data-rules>Rules</button>' +
    '<button class="btn" id="bdHomeBtn">Back to start</button>' +
    "</div>" +
    /* The Segment Summary is the summary layer over the replay's
       detail: every step draws the COMPLETE final trend structure —
       all segment lines as they finally stand and the final control
       lines in place — with the segments not yet reached drawn
       lighter as a roadmap (chartSVG's summary mode; only opacity
       differs per step, never geometry). At the final step every
       segment is at full strength and the chart matches the
       answered view. Captions still walk segment by segment. */
    chartSVG(q, { upto: st.idx, lines: q.result.finalLines, highlight: st.type === "break" ? st.idx : -1, summary: true,
      activeLegs: activeLegsAt(q.result, q.result.swings, q.candles.length - 1) }) +
    '<p class="bd-cap">' + esc(st.caption) + "</p>" +
    '<p class="small">Drag across the chart to inspect a candle and read the exact price under the cursor.</p></div>';
  bindRulesButtons();
  bindLegendButtons();
  document.getElementById("bdPrev").addEventListener("click", function () { if (bd.step > 0) { bd.step--; renderBreakdown(); } });
  document.getElementById("bdNext").addEventListener("click", function () { if (bd.step < steps.length - 1) { bd.step++; renderBreakdown(); } });
  document.getElementById("bdClose").addEventListener("click", function () { bd = null; box.innerHTML = ""; });
  document.getElementById("bdHomeBtn").addEventListener("click", function () { bd = null; renderIntro(); });
  bindChartCursors();
}

/* ---------------- control-point replay ----------------
   Candle by candle through the answered chart: each frame shows the
   control points in force after that candle's close — circles and
   lines labelled HH / LL / HL / LH, the straight segment lines
   appearing as their swings print — with a note on whether the
   controls moved on that close and why. Play auto-advances on a
   timer (stoppable, three speeds); the frames come from the rules
   engine (result.frames), so the replay always agrees with the
   answer and the Segment Summary. */
function stopStepTimer() {
  if (st && st.timer) { clearInterval(st.timer); st.timer = null; }
  var b = document.getElementById("stPlay");
  if (b) b.textContent = "Play";
}
function closeStepThrough() {
  stopStepTimer();
  st = null;
  var box = document.getElementById("bdbox");
  if (box) box.innerHTML = "";
}
function openStepThrough() {
  bd = null;
  stopStepTimer();
  var q = quiz.questions[quiz.idx];
  st = { step: 0, total: q.result.frames.length, timer: null, speed: 1 };
  renderStepThrough();
  var el = document.getElementById("bdbox");
  if (el && el.scrollIntoView) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function stepPlayTick() {
  if (!st) return;
  if (st.step < st.total - 1) { st.step++; renderStepThrough(); }
  if (st.step >= st.total - 1) stopStepTimer();
}
function toggleStepPlay() {
  if (!st) return;
  if (st.timer) { stopStepTimer(); return; }
  if (st.step >= st.total - 1) { st.step = 0; renderStepThrough(); }
  st.timer = setInterval(stepPlayTick, Math.round(1600 / st.speed));
  var b = document.getElementById("stPlay");
  if (b) b.textContent = "Pause";
}
function cycleStepSpeed() {
  if (!st) return;
  st.speed = st.speed >= 4 ? 1 : st.speed * 2;
  if (st.timer) {
    clearInterval(st.timer);
    st.timer = setInterval(stepPlayTick, Math.round(1600 / st.speed));
  }
  renderStepThrough();
}
function renderStepThrough() {
  if (!st) return;
  var box = document.getElementById("bdbox");
  if (!box) { if (st.timer) clearInterval(st.timer); st = null; return; }
  var q = quiz.questions[quiz.idx];
  var fr = q.result.frames[st.step];
  var swingsSoFar = q.result.swings.filter(function (s) { return s.idx <= st.step; });
  var hasActive = fr.lines.some(function (L) { return L.cls === "active"; });
  box.innerHTML =
    '<div class="feedback"><div class="bd-head"><h2>Control points, candle by candle</h2>' +
    '<span class="bd-step">Candle ' + (st.step + 1) + " of " + st.total + "</span></div>" +
    /* The controls sit directly under the header, above the trend box,
       chart and caption, so their position never depends on how much
       text a frame carries — stepping candle to candle cannot push
       Previous / Next up or down under the reader's pointer. The
       Back to start in this row is the replay's only start-screen
       control: the panel fits about one viewport, so a second one
       below the frame text stood in the same view as this one. */
    '<div class="row">' +
    '<button class="btn" id="stPrev"' + (st.step === 0 ? " disabled" : "") + ">Previous candle</button>" +
    '<button class="btn" id="stNext"' + (st.step === st.total - 1 ? " disabled" : "") + ">Next candle</button>" +
    '<button class="btn" id="stPlay">' + (st.timer ? "Pause" : "Play") + "</button>" +
    '<button class="btn" id="stSpeed">Speed ' + st.speed + "×</button>" +
    '<button class="btn" id="stClose">Close replay</button>' +
    '<button class="btn" id="stTopHomeBtn">Back to start</button>' +
    INFO_BTN +
    '<button class="btn" data-rules>Rules</button>' +
    "</div>" +
    '<p class="sub">The detail \u2014 the same story close by close, as it stood at each candle\'s close.</p>' +
    '<div class="trend-box"><span class="tb-k">Trend as of candle ' + (st.step + 1) + ':</span>' +
    '<span class="tb-v ' + fr.state + '">' + stateName(fr.state) + "</span>" +
    (hasActive ? '<span class="tb-k">Forming controls on this frame: active — not final</span>' : "") +
    "</div>" +
    chartSVG(q, { upto: fr.idx, lines: fr.lines, highlight: fr.idx, abbr: true, swings: swingsSoFar,
                  activeLegs: activeLegsAt(q.result, swingsSoFar, st.step) }) +
    '<p class="bd-cap">' + esc(fr.caption) + "</p>" +
    '<p class="small">Each frame is the chart as it stood at that candle\'s close: the control ' +
    "points labelled HH, LL, HL and LH are the ones in force at that moment, and the note says " +
    "whether they moved on that close — and why. A forming control point that is not final yet " +
    "is drawn dashed with a lowercase label (hh, hl) and marked active — not final; it turns " +
    "solid, with a bold capital label, at the close that makes it final. The line of a segment " +
    "that is still forming is dashed too, and follows the closes candle by candle, passing " +
    "through every candle of the leg; at that same close it turns solid — the straight line " +
    "between the swing points, unless the segment was born in a gap: a gap-born segment's line " +
    "keeps the path through the closes it had while forming, exactly as the answered view " +
    "draws it. " +
    "Tap the ⓘ button " +
    "in the controls above for the full guide to the lines and labels.</p></div>";
  bindRulesButtons();
  bindLegendButtons();
  document.getElementById("stTopHomeBtn").addEventListener("click", function () { renderIntro(); });
  document.getElementById("stPrev").addEventListener("click", function () { stopStepTimer(); if (st && st.step > 0) { st.step--; renderStepThrough(); } });
  document.getElementById("stNext").addEventListener("click", function () { stopStepTimer(); if (st && st.step < st.total - 1) { st.step++; renderStepThrough(); } });
  document.getElementById("stPlay").addEventListener("click", toggleStepPlay);
  document.getElementById("stSpeed").addEventListener("click", cycleStepSpeed);
  document.getElementById("stClose").addEventListener("click", closeStepThrough);
  bindChartCursors();
}

/* ---------------- Expert mode ----------------
   The speed game (Michael's idea, Oct 25, 2026): Candles (Realistic)
   charts, one after another from an endless supply, against a running
   clock. The goal is 10 correct answers IN A ROW; a single wrong
   answer ends the run on the spot (sudden death). The clock starts
   only when Start is tapped on the Expert gate — never while the
   reader is reading the gate or deciding — and stops at the tap of
   the 10th correct answer, or at the miss. There is no pause;
   Back to start abandons the run.
   A winning run updates the personal best (kept whether or not the
   player puts the time on the board) and offers an arcade-style
   initials entry for the local leaderboard: the top 4 winning times
   on THIS device. The quiz is a standalone page with no server, so
   the board cannot travel between devices — the copy says "on this
   device" and nothing anywhere implies otherwise. Best and board
   live in localStorage under the same guarded pattern as the
   Recently viewed history: where storage is blocked they simply
   live for the session. */
var EXPERT_BEST_KEY = "trendQuiz.expertBest.v1";
var EXPERT_BOARD_KEY = "trendQuiz.expertBoard.v1";
var expertBestCache;            // undefined = not loaded yet; null = no winning run
var expertBoardCache = null;    // null = not loaded yet
function loadExpertBest() {
  if (expertBestCache !== undefined) return expertBestCache;
  expertBestCache = null;
  try {
    var raw = window.localStorage ? window.localStorage.getItem(EXPERT_BEST_KEY) : null;
    var v = raw == null ? NaN : parseFloat(raw);
    if (isFinite(v) && v > 0) expertBestCache = v;
  } catch (e) { /* storage unavailable: session-only best */ }
  return expertBestCache;
}
function saveExpertBest() {
  try {
    if (window.localStorage && expertBestCache != null) {
      window.localStorage.setItem(EXPERT_BEST_KEY, String(expertBestCache));
    }
  } catch (e) { /* storage unavailable: nothing persists */ }
}
function loadExpertBoard() {
  if (expertBoardCache) return expertBoardCache;
  expertBoardCache = [];
  try {
    var raw = window.localStorage ? window.localStorage.getItem(EXPERT_BOARD_KEY) : null;
    if (raw) {
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        expertBoardCache = arr.filter(function (e) {
          return e && typeof e.init === "string" && isFinite(e.ms) && isFinite(e.t);
        }).sort(function (x, y) { return x.ms - y.ms; }).slice(0, 4);
      }
    }
  } catch (e) { /* storage unavailable: session-only board */ }
  return expertBoardCache;
}
function saveExpertBoard() {
  try {
    if (window.localStorage) window.localStorage.setItem(EXPERT_BOARD_KEY, JSON.stringify(expertBoardCache || []));
  } catch (e) { /* storage unavailable: nothing persists */ }
}
/* m:ss.t — minutes unpadded, seconds two digits, one decimal. */
function fmtClock(ms) {
  var t = Math.max(0, Math.round(ms / 100));
  var m = Math.floor(t / 600), s = Math.floor((t % 600) / 10), th = t % 10;
  return m + ":" + (s < 10 ? "0" : "") + s + "." + th;
}
function fmtDate(ts) {
  return new Date(ts).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}
/* The leaderboard block, identical on the Expert gate and the results
   card: rank, initials, time, date — fastest first, at most four —
   or one muted line while nobody has set a time. The Clear control
   matches the Recently viewed Clear. The board lives on this device
   only, and the closing line says exactly that. */
function boardHtml() {
  var b = loadExpertBoard();
  var out = '<div class="boardbox"><div class="bd-head"><h3 class="board-h">Expert leaderboard</h3>' +
    (b.length ? '<button class="btn topback" id="boardClear">Clear</button>' : "") + "</div>";
  if (!b.length) {
    out += '<p class="small">No Expert times yet — set the first one.</p>';
  } else {
    out += '<ul class="board-list">' + b.map(function (e, i) {
      return '<li><span class="b-rank">' + (i + 1) + '.</span><span class="b-init">' + esc(e.init) + "</span>" +
        '<span class="b-time">' + fmtClock(e.ms) + '</span><span class="b-date">' + esc(fmtDate(e.t)) + "</span></li>";
    }).join("") + "</ul>";
  }
  out += '<p class="small">The fastest winning times on this device.</p></div>';
  return out;
}
function bindBoardClear(rerender) {
  var c = document.getElementById("boardClear");
  if (c) c.addEventListener("click", function () {
    expertBoardCache = [];
    saveExpertBoard();
    rerender();
  });
}
function endExpertRun() {
  if (!ex) return;
  if (ex.timer) clearInterval(ex.timer);
  if (ex.nextTimer) clearTimeout(ex.nextTimer);
  ex = null;
}
function stopExpertTimer() {
  if (ex && ex.timer) { clearInterval(ex.timer); ex.timer = null; }
}
function expertElapsed() {
  return ex && ex.t0 != null ? performance.now() - ex.t0 : 0;
}
function tickExpertClock() {
  var el = document.getElementById("exClock");
  if (el && ex && ex.t0 != null) el.textContent = fmtClock(performance.now() - ex.t0);
}
function expertIdHtml(q) {
  return q.chartId ? '<span class="idwrap"><span class="chartid">Chart #' + q.chartId + "</span>" +
    '<button type="button" class="copyid" data-copyid="' + q.chartId + '" title="Copy chart number" ' +
    'aria-label="Copy chart number ' + q.chartId + '">' + COPY_ICON + "</button></span>" : "";
}

/* The gate: the clock at rest, the personal best, the board, and the
   one Start button. Nothing is timed here — the interval is created
   in startExpertRun, on the Start tap, and not a moment before. */
function renderExpertGate() {
  closeStepThrough();
  endExpertRun();
  quiz = null;
  var best = loadExpertBest();
  app.innerHTML =
    "<h1>Expert</h1>" +
    '<p class="sub">The speed game: Candles (Realistic) charts, one after another, against the clock. ' +
    "The goal is <strong>10 correct in a row</strong> — one wrong answer ends the run on the spot. " +
    "The clock below starts only when you tap Start, so take your time here.</p>" +
    '<div class="card">' +
    '<div class="gateclock">0:00.0</div>' +
    (best != null
      ? '<p class="tier">Your best: <strong>' + fmtClock(best) + "</strong> — 10 in a row.</p>"
      : '<p class="tier">No winning run yet. Under a minute for the 10 is the mark to brag about.</p>') +
    '<div class="row"><button class="btn primary" id="exStart">Start</button>' +
    '<button class="btn" id="exGateHome">Back to start</button></div>' +
    boardHtml() +
    "</div>";
  document.getElementById("exStart").addEventListener("click", startExpertRun);
  document.getElementById("exGateHome").addEventListener("click", renderIntro);
  bindBoardClear(function () { renderExpertGate(); });
}

function genExpertChart() {
  var targets = ["up", "down", "consolidation"];
  return genQuestion(targets[Math.floor(Math.random() * 3)]);
}
function startExpertRun() {
  endExpertRun();
  CANDLE_STYLE = "realistic";  // Expert charts are Realistic charts; STYLE_PICK stays "expert"
  ex = { phase: "run", streak: 0, t0: performance.now(), timer: null, nextTimer: null,
         lock: false, chart: genExpertChart(), result: null };
  ex.timer = setInterval(tickExpertClock, 50);
  renderExpertQuestion();
}
function renderExpertQuestion() {
  var q = ex.chart;
  rememberChart(q.chartId);
  app.innerHTML =
    '<div class="topbar"><span class="prog">Expert</span>' + expertIdHtml(q) +
    '<span class="score">Streak: ' + ex.streak + ' of 10</span>' +
    '<span class="exclock" id="exClock">' + fmtClock(expertElapsed()) + "</span>" +
    '<button class="btn topback" id="exHomeBtn">Back to start</button></div>' +
    '<div class="card">' +
    '<div id="chartbox">' + chartSVG(q, { bare: true }) + "</div>" +
    '<p class="small">Drag across the chart — a cursor follows, naming the candle under it and the exact price at that height.</p>' +
    '<p class="qtext">What state is the market in at the end of this chart?</p>' +
    '<div class="answers">' +
    '<button class="ans-btn" data-a="up">Uptrend</button>' +
    '<button class="ans-btn" data-a="down">Downtrend</button>' +
    '<button class="ans-btn" data-a="consolidation">Consolidation</button>' +
    "</div>" +
    '<div id="feedback"></div>' +
    "</div>";
  document.getElementById("exHomeBtn").addEventListener("click", function () { endExpertRun(); renderIntro(); });
  var btns = app.querySelectorAll(".ans-btn");
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener("click", function () { exAnswer(this.getAttribute("data-a")); });
  }
  bindChartCursors();
}
function exAnswer(pick) {
  if (!ex || ex.phase !== "run" || ex.lock) return;
  ex.lock = true;
  var q = ex.chart;
  var correct = pick === q.result.answer;
  var btns = app.querySelectorAll(".ans-btn");
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i], a = b.getAttribute("data-a");
    b.disabled = true;
    b.classList.toggle("correct", a === q.result.answer);
    b.classList.toggle("wrong", a === pick && !correct);
  }
  if (correct) {
    ex.streak++;
    if (ex.streak >= 10) {
      /* The clock stops at this tap — the elapsed time is captured
         before anything renders, and the interval is cleared. */
      var ms = performance.now() - ex.t0;
      stopExpertTimer();
      var best = loadExpertBest();
      var isBest = best == null || ms < best;
      if (isBest) { expertBestCache = ms; saveExpertBest(); }
      ex.result = { win: true, streak: 10, ms: ms, t: Date.now(), newBest: isBest, initSaved: null, initSkipped: false };
      document.getElementById("feedback").innerHTML =
        '<div class="feedback"><p class="verdict ok">Correct — that\u2019s 10 in a row! Time: ' + fmtClock(ms) + "</p></div>";
      ex.nextTimer = setTimeout(function () { renderExpertResults(); }, 1000);
    } else {
      /* Brief confirmation only — no explanation, no detour: the
         next chart is already on its way. */
      document.getElementById("feedback").innerHTML =
        '<div class="feedback"><p class="verdict ok">Correct — streak ' + ex.streak + " of 10.</p></div>";
      ex.nextTimer = setTimeout(function () {
        if (!ex || ex.phase !== "run") return;
        ex.chart = genExpertChart();
        ex.lock = false;
        renderExpertQuestion();
      }, 650);
    }
  } else {
    /* Sudden death: the clock stops at the miss, and the run is over. */
    var msMiss = performance.now() - ex.t0;
    stopExpertTimer();
    ex.result = { win: false, streak: ex.streak, ms: msMiss, t: Date.now(), newBest: false, initSaved: null, initSkipped: false };
    renderExpertMiss(pick);
  }
}
/* The miss still teaches: the chart revealed with its control lines,
   the standard explanation, and the run's final numbers — then the
   results card. No initials are ever asked for after a loss. */
function renderExpertMiss(pick) {
  ex.phase = "miss";
  var q = ex.chart;
  var ans = q.result.answer;
  app.innerHTML =
    '<div class="topbar"><span class="prog">Expert</span>' + expertIdHtml(q) +
    '<span class="score">Streak: ' + ex.result.streak + ' of 10</span>' +
    '<span class="exclock">' + fmtClock(ex.result.ms) + "</span>" +
    '<button class="btn topback" id="exHomeBtn">Back to start</button></div>' +
    '<div class="card">' +
    '<div id="chartbox">' + chartSVG(q, { lines: q.result.finalLines, highlight: q.result.lastBreakIdx,
      activeLegs: activeLegsAt(q.result, q.result.swings, q.candles.length - 1) }) + "</div>" +
    '<div class="feedback">' +
    '<p class="verdict no">Not quite — you said ' + stateName(pick) + "; the answer is " + stateName(ans) + ".</p>" +
    '<p class="explain">' + esc(q.result.explanation) + "</p>" +
    '<p class="explain">That miss ends the run at ' + ex.result.streak + " in a row, with " +
    fmtClock(ex.result.ms) + " on the clock.</p>" +
    '<div class="row"><button class="btn primary" id="exMissBtn">See your result</button></div>' +
    "</div></div>";
  document.getElementById("exHomeBtn").addEventListener("click", function () { endExpertRun(); renderIntro(); });
  document.getElementById("exMissBtn").addEventListener("click", renderExpertResults);
  bindChartCursors();
}
/* The results card — written to be screenshotted and shared: what
   game, what happened, the big time, the date. A win offers the
   initials entry for the board (Save or Skip; skipping keeps the win
   off the board but the personal best above already counts it). */
function renderExpertResults() {
  if (!ex || !ex.result) { renderExpertGate(); return; }
  ex.phase = "results";
  var r = ex.result;
  var best = loadExpertBest();
  var body = "";
  if (r.win) {
    body += '<div class="exbig">' + fmtClock(r.ms) + "</div>" +
      '<p class="tier"><strong>10 in a row</strong> · ' + esc(fmtDate(r.t)) + "</p>" +
      (r.newBest ? '<p class="verdict ok">New best!</p>'
                 : '<p class="small">Your best: ' + fmtClock(best) + "</p>");
    if (!r.initSaved && !r.initSkipped) {
      body += '<div class="boardbox"><p style="margin:0"><strong>Add this time to the leaderboard</strong></p>' +
        '<div class="replayrow"><input class="initin" id="initIn" type="text" maxlength="3" placeholder="ABC" ' +
        'autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Your initials">' +
        '<button class="btn primary" id="initSave">Save</button>' +
        '<button class="btn" id="initSkip">Skip</button></div>' +
        '<p class="err" id="initErr" hidden>Initials are 2 or 3 letters.</p></div>';
    } else if (r.initSaved) {
      body += '<p class="small">On the board as <strong>' + esc(r.initSaved) + "</strong>.</p>";
    }
  } else {
    body += '<p class="tier">Run over — one miss ends it.</p>' +
      '<div class="exbig">' + r.streak + " in a row</div>" +
      '<p class="tier">' + fmtClock(r.ms) + " on the clock · " + esc(fmtDate(r.t)) + "</p>" +
      (best != null ? '<p class="small">Your best: ' + fmtClock(best) + " (10 in a row).</p>" : "");
  }
  body += boardHtml();
  body += '<div class="row"><button class="btn primary" id="exAgain">Run it again</button>' +
    '<button class="btn" id="exResHome">Back to start</button></div>';
  app.innerHTML = "<h1>Trend Quiz — Expert</h1>" + '<div class="card">' + body + "</div>";
  document.getElementById("exAgain").addEventListener("click", renderExpertGate);
  document.getElementById("exResHome").addEventListener("click", renderIntro);
  bindBoardClear(function () { renderExpertResults(); });
  if (r.win && !r.initSaved && !r.initSkipped) {
    var inp = document.getElementById("initIn");
    inp.addEventListener("input", function () {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 3);
    });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") saveExpertInitials(); });
    document.getElementById("initSave").addEventListener("click", saveExpertInitials);
    document.getElementById("initSkip").addEventListener("click", function () {
      ex.result.initSkipped = true;
      renderExpertResults();
    });
    if (inp.focus) inp.focus();
  }
}
function saveExpertInitials() {
  if (!ex || !ex.result || !ex.result.win) return;
  var inp = document.getElementById("initIn");
  var v = (inp.value || "").toUpperCase().replace(/[^A-Z]/g, "");
  if (v.length < 2) {
    var err = document.getElementById("initErr");
    if (err) err.hidden = false;
    return;
  }
  var b = loadExpertBoard().slice();
  b.push({ init: v, ms: ex.result.ms, t: ex.result.t });
  b.sort(function (x, y) { return x.ms - y.ms; });
  expertBoardCache = b.slice(0, 4);
  saveExpertBoard();
  ex.result.initSaved = v;
  renderExpertResults();
}

/* ---------------- results ---------------- */
function tierMessage(score) {
  if (score === 10) return "Perfect score — you called every chart the way the method reads it.";
  if (score >= 8) return "Strong reading. The misses below are usually the one-segment-too-early trap — walk their Segment Summaries.";
  if (score >= 6) return "Getting there. Open the Segment Summary on each miss and find the exact rule that decided it.";
  if (score >= 4) return "The two ideas to lean on: a trend needs three segments, and it dies only on a close past the far control. Walk the Segment Summaries, then try a fresh set.";
  return "Tough set. Walk each Segment Summary slowly — the same few rules decide every chart — then try a fresh set.";
}
function renderResults() {
  closeStepThrough();
  var score = scoreSoFar();
  var items = quiz.answers.map(function (a, i) {
    var q = quiz.questions[i];
    var ans = q.result.answer;
    return "<li><span class=\"what\"><strong>Question " + (i + 1) + "</strong> — ended in " +
      (ans === "consolidation" ? "consolidation" : statePhrase(ans)) +
      ".<br><span class=\"small\">You said: " + (a ? stateName(a.pick) : "—") + "</span></span>" +
      '<span class="mark ' + (a && a.correct ? "ok" : "no") + '">' + (a && a.correct ? "✓ Correct" : "✗ Missed") + "</span>" +
      '<button class="btn" data-review="' + i + '">Review</button></li>';
  }).join("");
  app.innerHTML =
    "<h1>Your score: " + score + " / 10</h1>" +
    '<p class="tier">' + esc(tierMessage(score)) + "</p>" +
    '<div class="card"><h2>Review the set</h2><ul class="review-list">' + items + "</ul>" +
    '<div class="row"><button class="btn primary" id="newset">New set — 10 fresh charts</button>' +
    '<button class="btn" id="mainscreen">Main screen</button>' +
    '<button class="btn" data-rules>Rules</button>' +
    '<a class="btn" data-dl download="trend-quiz.html">Download a standalone copy</a></div></div>';
  document.getElementById("newset").addEventListener("click", newSet);
  document.getElementById("mainscreen").addEventListener("click", renderIntro);
  bindRulesButtons();
  var rb = app.querySelectorAll("[data-review]");
  for (var i = 0; i < rb.length; i++) {
    rb[i].addEventListener("click", function () {
      quiz.mode = "review";
      quiz.idx = parseInt(this.getAttribute("data-review"), 10);
      renderQuestion();
    });
  }
  bindDownloads();
}

renderIntro();
</script>
<script>document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-dl]').forEach(function(e){e.remove();});});</script></body>
