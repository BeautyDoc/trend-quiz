<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Trend Quiz</title>
    <style>
      :root{
        --bg:#f3f1ea; --card:#ffffff; --ink:#1b1e23; --muted:#5d6470;
        --line:#ddd7c8; --accent:#c2570d; --accent-ink:#ffffff;
        --blue:#2456c8; --orange:#e8762d; --green:#1d9e57; --red:#d43a2f;
        --purple:#7c2d92;
        --btn-bg:#ffffff; --btn-line:#c9c2b2; --soft:#f6f3ec;
        --good-bg:#e3f4e9; --bad-bg:#fbe7e3; --grey-line:#9aa0a8;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#111419; --card:#1a1e25; --ink:#edf0f4; --muted:#9aa4b0;
          --line:#2d333d; --accent:#e8762d; --btn-bg:#22272f; --btn-line:#3a414c;
          --soft:#20242c; --good-bg:#14301f; --bad-bg:#3a1d18; --grey-line:#6d757f;
          --purple:#c07fd6;
        }
      }
      *{ box-sizing:border-box; }
      body{
        margin:0; background:var(--bg); color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        font-size:17px; line-height:1.5;
      }
      .wrap{ max-width:880px; margin:0 auto; padding:18px 14px 48px; }
      h1,h2{ font-family:"Iowan Old Style",Palatino,Georgia,"Times New Roman",serif; line-height:1.15; margin:0; }
      h1{ font-size:32px; }
      h2{ font-size:24px; }
      .sub{ color:var(--muted); margin:6px 0 0; }
      .card{
        background:var(--card); border:1px solid var(--line); border-radius:10px;
        padding:16px; margin-top:14px;
      }
      .rules{ margin:12px 0 0; padding-left:20px; }
      .rules li{ margin:6px 0; }
      .btn{
        appearance:none; border:2px solid var(--btn-line); background:var(--btn-bg); color:var(--ink);
        border-radius:10px; padding:13px 20px; font-size:17px; font-weight:600; cursor:pointer;
        min-height:52px;
      }
      .btn:hover{ border-color:var(--accent); }
      .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
      .btn.primary:hover{ filter:brightness(1.07); }
      .btn:disabled{ opacity:.45; cursor:default; }
      .btn:disabled:hover{ border-color:var(--btn-line); }
      .btn.primary:disabled:hover{ border-color:var(--accent); }
      a.btn{ display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
      .dl-toast{
        position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:60;
        max-width:min(92vw,560px); background:var(--card); color:var(--ink);
        border:1px solid var(--line); border-radius:10px; padding:12px 16px;
        box-shadow:0 8px 28px rgba(0,0,0,.25); font-size:15.5px;
      }
      .dl-toast a{ color:var(--accent); font-weight:700; }
      .row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
      .topbar{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
      .topbar .prog{ font-weight:700; font-size:19px; }
      .topbar .score{ color:var(--muted); font-weight:600; }
      .bar{ height:8px; background:var(--soft); border:1px solid var(--line); border-radius:99px; margin-top:8px; overflow:hidden; }
      .bar > div{ height:100%; background:var(--accent); width:0%; transition:width .3s ease; }
      .qtext{ font-size:20px; font-weight:700; margin:14px 0 4px; }
      .answers{ display:grid; grid-template-columns:1fr; gap:10px; margin-top:10px; }
      @media (min-width:560px){ .answers{ grid-template-columns:1fr 1fr 1fr; } }
      .ans-btn{
        appearance:none; border:2px solid var(--btn-line); background:var(--btn-bg); color:var(--ink);
        border-radius:10px; padding:16px 10px; font-size:19px; font-weight:700; cursor:pointer; min-height:60px;
      }
      .ans-btn:hover:not(:disabled){ border-color:var(--accent); }
      .ans-btn:disabled{ cursor:default; }
      .ans-btn.correct{ background:var(--good-bg); border-color:var(--green); color:var(--ink); }
      .ans-btn.wrong{ background:var(--bad-bg); border-color:var(--red); color:var(--ink); }
      .feedback{ margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
      .verdict{ font-size:19px; font-weight:800; margin:0 0 6px; }
      .verdict.ok{ color:var(--green); }
      .verdict.no{ color:var(--red); }
      .explain{ margin:0; }
      .bd-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
      .bd-cap{ font-size:17px; margin:10px 0 0; }
      .bd-step{ color:var(--muted); font-weight:600; white-space:nowrap; }
      /* Trend-status readout in the control-point replay: the state of
         the market as of the candle on screen, updated every frame. */
      .trend-box{
        display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
        margin-top:12px; padding:9px 12px;
        background:var(--soft); border:1px solid var(--line); border-radius:8px;
      }
      .trend-box .tb-k{ color:var(--muted); font-weight:600; font-size:15.5px; }
      .trend-box .tb-v{ font-size:19px; font-weight:800; }
      .trend-box .tb-v.up{ color:var(--green); }
      .trend-box .tb-v.down{ color:var(--red); }
      .trend-box .tb-v.consolidation{ color:var(--muted); }
      /* The info (ⓘ) button that opens the "Reading the lines and
         labels" pop-up — sits with the replay / Segment Summary controls. */
      .info-btn{
        appearance:none; border:2px solid var(--btn-line); background:var(--btn-bg);
        color:var(--accent); border-radius:999px; width:52px; min-height:52px; padding:0;
        display:inline-flex; align-items:center; justify-content:center; cursor:pointer;
      }
      .info-btn:hover{ border-color:var(--accent); }
      .info-btn svg{ display:block; }
      .legend-panel p{ margin:8px 0; }
      .legend-panel h3{ margin:14px 0 4px; font-size:17px; }
      .legend-key{
        margin-top:8px; padding:10px 12px;
        background:var(--soft); border:1px solid var(--line); border-radius:8px;
        font-size:15px;
      }
      .legend-key .lk-row{ display:flex; gap:10px; align-items:flex-start; margin:6px 0; }
      .legend-key .lk-row:first-child{ margin-top:0; }
      .legend-key .lk-row:last-child{ margin-bottom:0; }
      .legend-key svg{ flex:none; margin-top:4px; }
      svg.chart{ width:100%; height:auto; display:block; touch-action:none; cursor:crosshair; }
      /* Crosshair readout docked under the chart — outside the plot area,
         so it can never cover a candle the reader needs to see. */
      .xh-readout{
        display:flex; flex-wrap:wrap; gap:2px 18px; align-items:baseline;
        margin-top:8px; padding:7px 10px; min-height:38px;
        background:var(--soft); border:1px solid var(--line); border-radius:8px;
        font-size:15px; font-variant-numeric:tabular-nums;
      }
      .xh-readout .xh-ro-1{ font-weight:700; }
      .xh-readout .xh-ro-3{ color:var(--muted); }
      .xh-readout .xh-ro-hint{ color:var(--muted); }
      .review-list{ margin:12px 0 0; padding:0; list-style:none; }
      .review-list li{
        display:flex; justify-content:space-between; align-items:center; gap:12px;
        border-top:1px solid var(--line); padding:10px 0;
      }
      .review-list .what{ min-width:0; }
      .review-list .mark{ font-weight:800; }
      .mark.ok{ color:var(--green); } .mark.no{ color:var(--red); }
      .small{ font-size:15px; color:var(--muted); }
      .gapopt{
        display:flex; align-items:center; gap:10px; margin-top:16px;
        font-size:17px; font-weight:600; cursor:pointer;
      }
      .gapopt input{ width:22px; height:22px; accent-color:var(--accent); cursor:pointer; flex:none; }
      .gapopt.off{ opacity:.45; cursor:default; }
      .gapopt.off input{ cursor:default; }
      .small.off{ opacity:.45; }
      .styleopt{ display:flex; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap; }
      .styleopt-label{ font-size:17px; font-weight:600; }
      .segctl{ display:inline-flex; border:2px solid var(--btn-line); border-radius:10px; overflow:hidden; }
      .segbtn{
        appearance:none; border:0; background:var(--btn-bg); color:var(--ink);
        padding:10px 18px; font-size:16px; font-weight:700; cursor:pointer; min-height:44px;
      }
      .segbtn.on{ background:var(--accent); color:var(--accent-ink); }
      .tier{ font-size:19px; margin-top:8px; }
      .chartid{ font-size:15px; color:var(--muted); font-weight:600; }
      .idwrap{ display:inline-flex; align-items:center; gap:7px; }
      /* Copy-the-chart-number button: sits immediately to the right
         of the "Chart #…" label in the top bar, on every screen that
         shows the number. Small, but a real touch target; after a
         copy it briefly shows a check and the word "Copied". */
      .copyid{
        appearance:none; border:2px solid var(--btn-line); background:var(--btn-bg);
        color:var(--accent); border-radius:8px; min-width:38px; min-height:34px; padding:3px 7px;
        display:inline-flex; align-items:center; justify-content:center; gap:5px; cursor:pointer;
        font-size:13px; font-weight:700;
      }
      .copyid:hover{ border-color:var(--accent); }
      .copyid svg{ display:block; }
      /* Expert mode: the running clock in the run's top bar, the
         still clock on the start gate, the giant final time on the
         results card, the initials entry and the leaderboard. */
      .exclock{ font-size:23px; font-weight:800; font-variant-numeric:tabular-nums; }
      .gateclock{ font-size:46px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1; margin:4px 0 2px; }
      .exbig{
        font-size:54px; font-weight:800; line-height:1.1; margin:8px 0 2px;
        font-variant-numeric:tabular-nums;
        font-family:"Iowan Old Style",Palatino,Georgia,"Times New Roman",serif;
      }
      .boardbox{ margin-top:16px; border-top:1px solid var(--line); padding-top:12px; }
      .board-h{ margin:0; font-size:19px; font-family:"Iowan Old Style",Palatino,Georgia,"Times New Roman",serif; }
      .board-list{ margin:6px 0 0; padding:0; list-style:none; }
      .board-list li{
        display:flex; align-items:baseline; gap:14px;
        border-top:1px solid var(--line); padding:8px 0; font-variant-numeric:tabular-nums;
      }
      .board-list li:first-child{ border-top:0; }
      .board-list .b-rank{ color:var(--muted); font-weight:700; width:26px; flex:none; }
      .board-list .b-init{ font-weight:800; letter-spacing:.14em; width:66px; flex:none; }
      .board-list .b-time{ font-weight:700; font-size:18px; }
      .board-list .b-date{ color:var(--muted); font-size:15px; margin-left:auto; }
      .initin{
        appearance:none; border:2px solid var(--btn-line); background:var(--btn-bg); color:var(--ink);
        border-radius:10px; padding:12px 14px; font-size:19px; font-weight:800; min-height:52px;
        width:124px; max-width:42vw; letter-spacing:.18em; text-transform:uppercase;
      }
      .initin:focus{ outline:none; border-color:var(--accent); }
      /* The way home in the top bar itself — visible without
         scrolling on the question and answered views. */
      .topback{ padding:7px 13px; font-size:15px; min-height:38px; align-self:center; }
      .replayrow{ display:flex; flex-wrap:wrap; gap:10px; margin-top:10px; }
      .txtin{
        appearance:none; border:2px solid var(--btn-line); background:var(--btn-bg); color:var(--ink);
        border-radius:10px; padding:12px 14px; font-size:17px; min-height:52px;
        width:230px; max-width:100%; letter-spacing:.06em;
      }
      .txtin:focus{ outline:none; border-color:var(--accent); }
      .err{ color:var(--red); font-size:15px; margin-top:8px; }
      .rules-overlay{
        position:fixed; inset:0; z-index:50; overflow-y:auto; padding:24px 12px;
        background:rgba(0,0,0,.48); display:flex; align-items:flex-start; justify-content:center;
      }
      .rules-panel{
        background:var(--card); border:1px solid var(--line); border-radius:10px;
        padding:16px; width:100%; max-width:680px;
      }
      @media (prefers-reduced-motion: reduce){ .bar > div{ transition:none; } }
    </style>

    <script>
"use strict";
/* Capture this page's own source before anything renders, so the
   "Download a standalone copy" button can hand back the identical file. */
var PRISTINE_HTML = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;

/* ---------------- utilities ---------------- */
/* Every random draw in chart generation goes through RNG(), which is
   normally Math.random but is swapped for a seeded PRNG while a chart
   is being generated — so a chart is fully determined by its seed. */
var rngImpl = Math.random;
function RNG() { return rngImpl(); }
/* A second, independent stream used ONLY for the gap-segment feature
   in buildCandles. It is seeded from the chart seed inside withSeed,
   so every RNG() draw above keeps exactly the value it had before the
   feature existed: a replayed chart ID rebuilds the same candles it
   always did, plus any gap segment the gap rule adds. */
var rngAuxImpl = Math.random;
function AUXRNG() { return rngAuxImpl(); }
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function withSeed(seed, fn) {
  var prev = rngImpl, prevAux = rngAuxImpl;
  rngImpl = mulberry32(seed);
  rngAuxImpl = mulberry32((seed ^ 0x85EBCA6B) >>> 0);
  try { return fn(); } finally { rngImpl = prev; rngAuxImpl = prevAux; }
}
function rand(a, b) { return a + RNG() * (b - a); }
function randi(a, b) { return Math.floor(rand(a, b + 1)); }
function pick(arr) { return arr[Math.floor(RNG() * arr.length)]; }
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(RNG() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function fmt(p) { return p.toFixed(2); }
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ---------------- chart recipes ----------------
   A recipe builds a list of segment specs with absolute prices.
   Each segment: {len, from, to, dir} travels monotonically from->to.
   Optional: gapOpen (first candle opens here instead of `from`),
   gapSwing (register the gap open as a swing point — the gap rule),
   endSwing=false (no swing at segment end), pokeLevel/pokeIdx (one
   candle's wick pokes beyond that price while its close stays inside). */
function Recipe(start) {
  this.start = start; this.p = start; this.segs = [];
}
Recipe.prototype.add = function (len, to, opts) {
  var from = this.p;
  var seg = { len: len, from: from, to: to, dir: Math.sign(to - from) || 1 };
  if (opts) { for (var k in opts) seg[k] = opts[k]; }
  this.segs.push(seg); this.p = to; return this;
};
Recipe.prototype.gapDip = function (len, gapOpen, to) {
  /* A retrace that arrives by gap: candle 1 opens at gapOpen (the swing
     extreme, a body point) and price recovers toward `to`. */
  var from = this.p;
  this.segs.push({
    len: len, from: from, to: to, dir: Math.sign(to - gapOpen) || 1,
    gapOpen: gapOpen, gapSwing: true,
    gapType: gapOpen < from ? "low" : "high", endSwing: false
  });
  this.p = to; return this;
};
Recipe.prototype.total = function () {
  return this.segs.reduce(function (a, s) { return a + s.len; }, 0);
};

/* Clean trend in direction s (+1 up, -1 down), optionally with a gap
   retrace or a wick poke through the far control line. */
function buildTrend(s, mods) {
  var p0 = rand(70, 320);
  var R = new Recipe(p0);
  var m1 = p0 * rand(0.06, 0.10);
  R.add(randi(5, 7), p0 + s * m1);                       // impulse 1
  var bMag = m1 * rand(0.38, 0.58);
  R.add(randi(4, 6), R.p - s * bMag);                    // correction
  var farPrice = R.p;                                    // controlling low/high
  var cMag = m1 * rand(0.95, 1.35);
  R.add(randi(5, 7), R.p + s * cMag);                    // impulse 2 -> trend established
  var nearPrice = R.p;
  var dd = cMag - bMag;                                  // near-to-far distance
  var dMag = dd * rand(0.35, 0.60);
  var farAfter;
  if (mods.gap) {
    /* Gap retrace that stops SHORT of the far line: the gap is the
       correction's extreme, so it becomes the far control when the
       trend resumes (rule 4). A gap that jumped the line would break
       the trend instead (rule 3) — that is a different chart. */
    var Wg = Math.abs(nearPrice - farPrice);
    var G = farPrice + s * Wg * rand(0.10, 0.30);
    R.gapDip(randi(3, 4), G, nearPrice - s * Wg * rand(0.35, 0.55));
    farAfter = G;
  } else {
    var opts = {};
    if (mods.poke) { opts.pokeLevel = farPrice; opts.pokeIdx = 1; }
    R.add(randi(4, 6), nearPrice - s * dMag, opts);      // pullback, closes hold
    farAfter = R.p;
  }
  R.add(randi(5, 7), nearPrice + s * rand(2.5, 8));      // new extreme, trend continues
  var newNear = R.p;
  if (R.total() < 25) {
    var fMag = Math.abs(newNear - farAfter) * rand(0.30, 0.55);
    R.add(randi(3, 4), newNear - s * fMag);
    R.add(randi(4, 5), newNear + s * rand(2, 7));
  }
  return R;
}

/* Trend in direction -s first, broken by a move in direction s that
   grows into a full new trend. If established=false the opening move is
   a sharp decline/rally that never quite became a trend (V-reversal). */
function buildReversal(s, established) {
  var p0 = rand(70, 320);
  var R = new Recipe(p0);
  var m1 = p0 * rand(0.06, 0.10);
  R.add(randi(5, 7), p0 - s * m1);                       // move against s
  var bMag = m1 * rand(0.38, 0.55);
  R.add(randi(4, 6), R.p + s * bMag);                    // retrace
  var farOld = R.p;                                      // old trend's far control
  var base;
  if (established) {
    var cMag = m1 * rand(0.95, 1.30);
    R.add(randi(5, 7), R.p - s * cMag);                   // old trend established
    base = R.p;
  } else {
    base = p0 - s * m1;                                  // V bottom/top = end of first leg
    R.p = base; R.segs.length = 1;                       // drop the retrace; rebuild below
    R.add(randi(3, 4), base + s * bMag);                  // small retrace only
    farOld = R.p;
  }
  var dEnd = farOld + s * rand(3, 9);                    // break leg, closes beyond farOld
  var brkOpts = null;
  if (INCLUDE_GAPS && RNG() < 0.4) {
    /* Sometimes the break arrives as a gap: the leg's first candle
       opens already beyond farOld — a break just the same (rule 3). */
    brkOpts = { gapOpen: farOld + s * rand(1.0, 3.5) };
  }
  R.add(randi(4, 6), dEnd, brkOpts);
  var eMag = Math.abs(dEnd - base) * rand(0.30, 0.50);
  R.add(randi(3, 5), dEnd - s * eMag);                   // correction of the new move
  R.add(randi(5, 7), dEnd + s * rand(2.5, 8));           // third segment -> new trend
  var newNear = R.p;
  if (R.total() < 25) {
    var fMag = Math.abs(newNear - (dEnd - s * eMag)) * rand(0.3, 0.5);
    R.add(randi(3, 4), newNear - s * fMag);
    R.add(randi(4, 5), newNear + s * rand(2, 7));
  }
  return R;
}

/* Old trend in direction s with a wide range. Three counter-segments
   form the opposite pattern inside the range. If confirm=true the last
   counter-segment closes beyond the far control, confirming the new
   trend; if false every close holds and the old trend survives. */
function buildInsideRange(s, confirm) {
  var p0 = rand(70, 320);
  var R = new Recipe(p0);
  var m1 = p0 * rand(0.07, 0.11);
  R.add(randi(5, 7), p0 + s * m1);
  var bMag = m1 * rand(0.42, 0.55);
  R.add(randi(4, 6), R.p - s * bMag);
  var farPrice = R.p;
  var cMag = m1 * rand(1.10, 1.45);
  R.add(randi(5, 7), R.p + s * cMag);
  var nearPrice = R.p;
  var W = Math.abs(nearPrice - farPrice);
  var aMag = W * rand(0.42, 0.55);
  R.add(randi(4, 6), nearPrice - s * aMag);              // counter segment 1
  var b2 = aMag * rand(0.35, 0.55);
  R.add(randi(3, 5), R.p + s * b2);                      // counter segment 2 (retrace)
  if (confirm) {
    var cOpts = null;
    if (INCLUDE_GAPS && RNG() < 0.4) cOpts = { gapOpen: farPrice - s * rand(1.0, 3.0) }; // the confirming break arrives as a gap
    R.add(randi(4, 6), farPrice - s * rand(2, 6), cOpts); // counter segment 3 closes beyond far
  } else {
    R.add(randi(4, 6), farPrice + s * W * rand(0.10, 0.18)); // stops inside the range
  }
  R.add(randi(3, 4), R.p + s * W * rand(0.08, 0.15));    // small bounce, changes nothing
  return R;
}

/* Trend in direction s, then a break, then a bounce and a lower second
   leg that never completes a new trend -> consolidation. */
function buildBreakChop(s) {
  var p0 = rand(70, 320);
  var R = new Recipe(p0);
  var m1 = p0 * rand(0.06, 0.10);
  R.add(randi(5, 7), p0 + s * m1);
  var bMag = m1 * rand(0.38, 0.58);
  R.add(randi(4, 6), R.p - s * bMag);
  var farPrice = R.p;
  var cMag = m1 * rand(0.95, 1.35);
  R.add(randi(5, 7), R.p + s * cMag);
  var nearPrice = R.p;
  var bcOpts = null;
  if (INCLUDE_GAPS && RNG() < 0.4) bcOpts = { gapOpen: farPrice - s * rand(1.0, 3.0) }; // break arrives as a gap
  R.add(randi(4, 6), farPrice - s * rand(3, 8), bcOpts); // break leg
  var brk = R.p;
  var bounceMag = Math.abs(nearPrice - brk) * rand(0.30, 0.55);
  R.add(randi(3, 5), brk + s * bounceMag);               // bounce, stays below/above near
  var eEnd = R.p;
  R.add(randi(3, 5), brk + s * Math.abs(eEnd - brk) * rand(0.30, 0.55)); // second leg, higher low / lower high
  return R;
}

/* Trend in direction s, then a break and at most one bounce segment. */
function buildBreakFew(s) {
  var p0 = rand(70, 320);
  var R = new Recipe(p0);
  var m1 = p0 * rand(0.06, 0.10);
  R.add(randi(5, 7), p0 + s * m1);
  var bMag = m1 * rand(0.38, 0.58);
  R.add(randi(4, 6), R.p - s * bMag);
  var farPrice = R.p;
  var cMag = m1 * rand(0.95, 1.35);
  R.add(randi(5, 7), R.p + s * cMag);
  var nearPrice = R.p;
  var bfOpts = null;
  if (INCLUDE_GAPS && RNG() < 0.4) bfOpts = { gapOpen: farPrice - s * rand(1.0, 3.0) }; // break arrives as a gap
  R.add(randi(4, 6), farPrice - s * rand(3, 8), bfOpts); // break leg
  var brkEnd = R.p;
  if (RNG() < 0.6) {
    var bounceMag = Math.abs(nearPrice - brkEnd) * rand(0.30, 0.55);
    R.add(randi(3, 5), brkEnd + s * bounceMag);
  } else if (R.total() < 24) {
    R.add(randi(3, 4), brkEnd - s * rand(1.5, 4));       // the break leg extends a little further
  }
  return R;
}

/* Sideways contracting range: highs step down, lows step up, so no
   three-segment trend can ever complete. */
function buildChop() {
  var p0 = rand(70, 320);
  var R = new Recipe(p0);
  var range = p0 * rand(0.10, 0.16);
  var hi = p0 + range * 0.5, lo = p0 - range * 0.5;
  var upFirst = RNG() < 0.5;
  var nSeg = randi(6, 8);
  var prevHigh = hi, prevLow = lo;
  for (var i = 0; i < nSeg; i++) {
    var goUp = (i % 2 === 0) === upFirst;
    var to;
    if (i === 0) { to = goUp ? hi : lo; }
    else if (goUp) { prevHigh = prevHigh - range * rand(0.05, 0.13); to = prevHigh; }
    else { prevLow = prevLow + range * rand(0.05, 0.13); to = prevLow; }
    if (prevHigh - prevLow < range * 0.2) { to = goUp ? prevHigh : prevLow; }
    R.add(randi(4, 5), to);
  }
  return R;
}

/* Impulse + correction + a second impulse that falls short of a new
   extreme: no trend is ever established. */
function buildShort(s) {
  var p0 = rand(70, 320);
  var R = new Recipe(p0);
  var m1 = p0 * rand(0.06, 0.10);
  R.add(randi(6, 8), p0 + s * m1);
  var first = R.p;
  var bMag = m1 * rand(0.38, 0.58);
  R.add(randi(5, 7), R.p - s * bMag);
  R.add(randi(6, 8), first - s * m1 * rand(0.04, 0.10)); // falls short of the first extreme
  var cEnd = R.p;
  R.add(randi(4, 6), R.p - s * m1 * rand(0.05, 0.12));   // drift, still no third segment
  R.add(randi(3, 5), R.p + s * Math.abs(cEnd - R.p) * rand(0.30, 0.60)); // small bounce, stays short
  return R;
}

/* ---------------- candle construction ----------------
   Turns a recipe into candles, then reads the swing events the rules
   engine consumes off the candles that were actually drawn (see the
   derivation pass at the end): a swing's price is always a real body
   point — body high max(open, close), body low min(open, close) —
   never the recipe's planned endpoint. In Easy mode closes move
   monotonically within a segment, so the derived swings land exactly
   on the planned endpoints; in Realistic mode counter-trend closes
   can carry a leg's true extreme past the plan, and the swings
   follow the bodies. */
function buildCandles(R) {
  var candles = [];
  var segRanges = [];
  var rangeMeta = [];
  var initialSpan = null;
  /* Body-run subdivision (the teacher's single-candle ruling): a
     segment is a maximal run of consecutive same-direction bodies.
     Every candle whose body opposes the current run ends that run
     and starts a new segment — a run of one candle is a full segment
     with its own swing. Zero-body candles (open == close) oppose
     nothing: they join the run they sit in, as before. Each run
     becomes one derived segment below; the run's end swing is scanned
     over the run plus the following run (the junction convention). */
  function pushBodyRuns(a, b, seg, opts) {
    opts = opts || {};
    var runs = [], cur = null, i, s;
    for (i = a; i <= b; i++) {
      /* A segment that opens with a registered gap (a break or
         confirming leg): its first candle's direction is read from
         the previous close, gap included — the gap is part of that
         candle's move (gap precedence). Otherwise a leg whose gap
         overshoots its end would read as a counter-drift and lose
         the gap extreme as its swing. Plain segments and counter-gap
         parts read bodies as usual. */
      s = (i === a && opts.anchorFrom != null)
        ? Math.sign(candles[i].c - opts.anchorFrom)
        : Math.sign(candles[i].c - candles[i].o);
      if (!cur) { cur = { from: i, to: i, dir: s }; runs.push(cur); continue; }
      if (s !== 0 && cur.dir !== 0 && s !== cur.dir) { cur = { from: i, to: i, dir: s }; runs.push(cur); }
      else { cur.to = i; if (cur.dir === 0) cur.dir = s; }
    }
    runs.forEach(function (r, ri) {
      segRanges.push({ from: r.from, to: r.to });
      rangeMeta.push({
        dir: r.dir || seg.dir,
        gapType: ri === 0 && opts.gapType ? opts.gapType : null,
        gapAt: ri === 0 && opts.gapAt != null ? opts.gapAt : -1,
        endSwing: ri === runs.length - 1 ? seg.endSwing !== false : true,
        selfEnd: !!opts.selfEndLast && ri === runs.length - 1,
        scanFrom: r.from
      });
    });
  }
  R.segs.forEach(function (seg, si) {
    var from = candles.length;
    var startPrice = seg.gapOpen != null ? seg.gapOpen : seg.from;
    if (INCLUDE_GAPS && seg.gapOpen == null && seg.len >= 3 && Math.abs(seg.to - seg.from) > 5 && RNG() < 0.30) {
      /* Cosmetic gap at the segment start, in either direction: with the
         segment's travel (part of the ongoing move) or against it. These
         register no swing, but they are real candles to the engine: one
         that jumps the far control point breaks the trend, exactly like
         the registered gap retrace (gapDip) can. */
      var gf = RNG() < 0.45 ? -rand(0.05, 0.16) : rand(0.08, 0.22);
      startPrice = seg.from + (seg.to - seg.from) * gf;
    }
    /* Gap segment (the head teacher's rule): even a tiny gap against
       the move, sitting between directional candles, counts as a
       segment all by itself. On some longer segments one candle opens
       gapped against the segment's travel — a small jump back — and
       the segment then continues; the derivation below splits such a
       segment at the gap and reads the gap as its own segment
       (pre-gap extreme, gap swing, end extreme). The draws come from
       the AUX stream, so every RNG() draw keeps its old value and
       replayed chart IDs keep their candles, plus any gap segment
       the new rule adds. Segments that already open with a gap, and
       poke segments, are left alone. */
    var gapJ = -1, gapSize = 0;
    if (INCLUDE_GAPS && seg.gapOpen == null && seg.pokeLevel == null &&
        seg.len >= 5 && Math.abs(seg.to - seg.from) > 5 && AUXRNG() < 0.25) {
      gapJ = 2 + Math.floor(AUXRNG() * (seg.len - 3));
      gapSize = Math.abs(seg.to - seg.from) * (0.08 + AUXRNG() * 0.14);
    }
    var w = [], tw = 0, i, x;
    if (CANDLE_STYLE === "realistic") {
      /* Realistic candles: body sizes vary widely and some candles close
         against the segment's direction (red candles inside an up-move,
         green inside a down-move), like real price action. The steps
         still sum to the segment move, but individual closes can stray
         past the segment's ends — the swing derivation below reads the
         true body extremes wherever they land, so control levels and
         the answer follow the drawn candles. Steps are kept bounded so
         no candle strays far past the segment's ends. */
      var okR = false, tries = 0, cumR, fr, i2;
      while (!okR && tries < 24) {
        tries++;
        w = []; tw = 0;
        for (i = 0; i < seg.len; i++) {
          x = RNG() < 0.30 ? -rand(0.15, 0.65) : rand(0.30, 1.75);
          w.push(x); tw += x;
        }
        if (tw < seg.len * 0.30) continue;
        cumR = 0; okR = true;
        for (i2 = 0; i2 < seg.len; i2++) {
          cumR += w[i2]; fr = cumR / tw;
          if (fr < -0.30 || fr > 1.35) { okR = false; break; }
        }
      }
      if (!okR) {
        w = []; tw = 0;
        for (i = 0; i < seg.len; i++) { x = rand(0.55, 1.45); w.push(x); tw += x; }
      }
    } else {
      for (i = 0; i < seg.len; i++) { x = rand(0.55, 1.45); w.push(x); tw += x; }
    }
    var cum = 0, closes = [];
    for (i = 0; i < seg.len; i++) { cum += w[i]; closes.push(startPrice + (seg.to - startPrice) * (cum / tw)); }
    closes[seg.len - 1] = seg.to;
    var stepScale = Math.max(Math.abs(seg.to - startPrice) / seg.len, 0.4);
    var wLo = CANDLE_STYLE === "realistic" ? 0.05 : 0.10;
    var wHi = CANDLE_STYLE === "realistic" ? 1.05 : 0.70;
    for (i = 0; i < seg.len; i++) {
      var o = i === 0 ? startPrice : (i === gapJ ? closes[i - 1] - seg.dir * gapSize : closes[i - 1]);
      var c = closes[i];
      var h = Math.max(o, c) + rand(wLo, wHi) * stepScale;
      var l = Math.min(o, c) - rand(wLo, wHi) * stepScale;
      if (seg.pokeLevel != null && i === seg.pokeIdx) {
        if (seg.dir > 0) h = seg.pokeLevel + rand(0.5, 2.4);
        else l = seg.pokeLevel - rand(0.5, 2.4);
      }
      candles.push({ o: o, h: h, l: l, c: c });
    }
    var segTo = candles.length - 1;
    if (si === 0) initialSpan = gapJ >= 0 ? { from: from, to: from + gapJ - 1 } : { from: from, to: segTo };
    if (seg.gapSwing) {
      /* A gap retracement (gapDip): the gap itself is the segment —
         one unit carrying the gap swing over its whole span and no
         end swing, exactly as before (gap precedence). */
      segRanges.push({ from: from, to: segTo });
      rangeMeta.push({
        dir: seg.dir, gapType: seg.gapType, gapAt: -1,
        endSwing: seg.endSwing !== false, selfEnd: false, scanFrom: from
      });
    } else if (gapJ < 0) {
      pushBodyRuns(from, segTo, seg, seg.gapOpen != null ? { anchorFrom: seg.from } : null);
    } else {
      /* Split at the gap candle, then split each part into body runs.
         The first part ends at the pre-gap extreme — the gap is a hard
         junction, so its last run's end scan stays inside the part.
         The second part opens with the gap candle: its first run
         carries the gap swing. If that candle's body also runs against
         the move, the gap swing and the run's own end swing are the
         same type and merge in the derivation — the candle is one
         segment, never two (gap precedence). */
      var gAbs = from + gapJ;
      pushBodyRuns(from, gAbs - 1, seg, { selfEndLast: true });
      pushBodyRuns(gAbs, segTo, seg, { gapType: seg.dir > 0 ? "low" : "high", gapAt: gAbs });
    }
  });

  /* ---- swing derivation: read every swing off the drawn bodies ----
     A segment-end swing is the extreme body point over its own
     segment plus the following one: a turn's true extreme can sit in
     the first candles of the next segment (a counter-trend dip just
     past the junction undercuts the planned start; an early run past
     the junction overshoots the planned end), so both sides of the
     junction are scanned. A gap swing is the extreme body point of
     its gap segment — the gap open is that segment's first body
     point. A segment carrying a counter-gap was split into two
     ranges when its candles were built: the first range's end swing
     is the pre-gap extreme, read over its own candles only (the gap
     is a hard junction, so the scan does not cross it), and the
     second range opens with the gap swing — the gap candle's own
     body extreme — before its end swing. The engine therefore walks
     the gap as a segment in its own right, exactly as drawn. On top
     of that, every range is subdivided into maximal runs of
     same-direction bodies (pushBodyRuns above): a single candle
     against the move is a segment of its own, and its end swing is
     read with the same junction convention — over its run plus the
     following run. The same-type continuation merge works exactly
     as before, only on derived values. Every control point, control
     line, break comparison, explanation number and overlay vertex
     consumes these swings, so they all sit on real body points. */
  function bodyExtreme(from, to, type) {
    var best = null, bestIdx = from, i, v;
    for (i = from; i <= to; i++) {
      v = type === "high" ? Math.max(candles[i].o, candles[i].c)
                          : Math.min(candles[i].o, candles[i].c);
      if (best === null || (type === "high" ? v > best : v < best)) { best = v; bestIdx = i; }
    }
    return { idx: bestIdx, price: best };
  }
  var swingEvents = [];
  var initialSwing = {
    idx: 0, price: R.start,
    type: R.segs[0].dir > 0 ? "low" : "high", seg: -1, gap: false
  };
  var ix0 = bodyExtreme(initialSpan.from, initialSpan.to, initialSwing.type);
  initialSwing.idx = ix0.idx; initialSwing.price = ix0.price;
  var lastSwing = initialSwing;
  segRanges.forEach(function (range, xi) {
    var m = rangeMeta[xi];
    if (m.gapType) {
      var gx = m.gapAt >= 0 ? bodyExtreme(m.gapAt, m.gapAt, m.gapType)
                            : bodyExtreme(range.from, range.to, m.gapType);
      var gs = { idx: gx.idx, price: gx.price, type: m.gapType, seg: xi, gap: true };
      swingEvents.push(gs); lastSwing = gs;
    }
    if (m.endSwing) {
      var type = m.dir > 0 ? "high" : "low";
      var endTo = m.selfEnd ? range.to
                            : (xi + 1 < segRanges.length ? segRanges[xi + 1].to : range.to);
      var ex = bodyExtreme(m.scanFrom, endTo, type);
      var ev = { idx: ex.idx, price: ex.price, type: type, seg: xi, gap: false };
      if (lastSwing && lastSwing.type === type) {
        /* Same-direction continuation: the later, more extreme point
           replaces the earlier swing. */
        var moreExtreme = type === "high" ? ev.price >= lastSwing.price : ev.price <= lastSwing.price;
        if (moreExtreme) {
          lastSwing.price = ev.price; lastSwing.idx = ev.idx; lastSwing.seg = xi;
        }
      } else {
        swingEvents.push(ev); lastSwing = ev;
      }
    }
  });
  return { candles: candles, segRanges: segRanges, swingEvents: swingEvents, initialSwing: initialSwing };
}

/* ---------------- Line view (closes only) ----------------
   The Trade Phantoms mini-lesson teaches trend in line view, "not
   considering gaps": the chart is a single line through the closes
   and is judged on closes alone. This builds that view of a chart
   from its recipe and its already-built candles (the closes are the
   same in both views, and no random draws are consumed, so candle
   generation and replay IDs are untouched):
   - segment ranges are the maximal runs of closes moving one way
     inside each recipe segment — the candle view's counter-gap split
     does not exist here, so a gap never counts as a segment of its
     own, but a single close moving against the run is a one-point
     segment of its own, exactly as a single counter-candle is in
     the candle views;
   - swings are derived with the same discipline as the candle view
     (a segment-end swing is the extreme over its own segment plus
     the following one, with the same same-type continuation merge),
     but the extreme is read over CLOSES, and no swing is a gap
     swing — a gap in the data is just a steep step between
     consecutive closes;
   - the pseudo-candles carry the close as open/high/low/close, so
     the shared analyzer's break checks compare closes only and its
     gap and poke checks can never fire (analyze also skips them
     outright in line mode). */
function buildLineView(R, candles) {
  var segRanges = [], lineMeta = [], pos = 0, initialSpan = null;
  R.segs.forEach(function (seg, si) {
    var a = pos, b = pos + seg.len - 1;
    pos += seg.len;
    if (si === 0) initialSpan = { from: a, to: b };
    if (seg.endSwing === false) {
      /* A gap retracement segment carries no end swing (gaps are not
         considered in Line view); it stays one unit, as before. */
      segRanges.push({ from: a, to: b });
      lineMeta.push({ dir: seg.dir, endSwing: false });
      return;
    }
    /* Subdivide into maximal runs of closes moving one way — the
       single-candle rule applied to closes: one close moving against
       the current run is a one-point segment of its own, never
       absorbed. An unchanged close moves neither way and joins the
       run it sits in. A candle's direction is its close against the
       previous close (the recipe start, for the very first). */
    var runs = [], cur = null, i, s, ref;
    for (i = a; i <= b; i++) {
      ref = i === 0 ? R.start : candles[i - 1].c;
      s = Math.sign(candles[i].c - ref);
      if (!cur) { cur = { from: i, to: i, dir: s }; runs.push(cur); continue; }
      if (s !== 0 && cur.dir !== 0 && s !== cur.dir) { cur = { from: i, to: i, dir: s }; runs.push(cur); }
      else { cur.to = i; if (cur.dir === 0) cur.dir = s; }
    }
    runs.forEach(function (r, ri) {
      segRanges.push({ from: r.from, to: r.to });
      lineMeta.push({ dir: r.dir || seg.dir, endSwing: ri === runs.length - 1 ? seg.endSwing !== false : true });
    });
  });
  function closeExtreme(from, to, type) {
    var best = null, bestIdx = from, i, v;
    for (i = from; i <= to; i++) {
      v = candles[i].c;
      if (best === null || (type === "high" ? v > best : v < best)) { best = v; bestIdx = i; }
    }
    return { idx: bestIdx, price: best };
  }
  var swingEvents = [];
  var initialSwing = {
    idx: 0, price: R.start,
    type: R.segs[0].dir > 0 ? "low" : "high", seg: -1, gap: false
  };
  var ix0 = closeExtreme(initialSpan.from, initialSpan.to, initialSwing.type);
  initialSwing.idx = ix0.idx; initialSwing.price = ix0.price;
  var lastSwing = initialSwing;
  segRanges.forEach(function (range, xi) {
    var m = lineMeta[xi];
    if (!m.endSwing) return;
    var type = m.dir > 0 ? "high" : "low";
    var endTo = xi + 1 < segRanges.length ? segRanges[xi + 1].to : range.to;
    var ex = closeExtreme(range.from, endTo, type);
    var ev = { idx: ex.idx, price: ex.price, type: type, seg: xi, gap: false };
    if (lastSwing && lastSwing.type === type) {
      var moreExtreme = type === "high" ? ev.price >= lastSwing.price : ev.price <= lastSwing.price;
      if (moreExtreme) {
        lastSwing.price = ev.price; lastSwing.idx = ev.idx; lastSwing.seg = xi;
      }
    } else {
      swingEvents.push(ev); lastSwing = ev;
    }
  });
  var pseudo = candles.map(function (c) { return { o: c.c, h: c.c, l: c.c, c: c.c }; });
  return { candles: pseudo, segRanges: segRanges, swingEvents: swingEvents, initialSwing: initialSwing };
}
/* ---------------- rules engine ----------------
   Walks the segments in order — the derived segments are maximal
   runs of same-direction bodies (a single counter-candle is a
   segment of its own), including gap segments, which the derivation
   splits out of any segment carrying a counter-gap, so a tiny gap
   between directional candles counts toward the three segments like
   any other segment. A trend is established only once its third
   segment has ended — recognized at the start of the fourth segment
   — and its controls exist from that moment; control updates then
   happen at swing points. Breaks are checked on every candle — a
   close beyond the far control point, or a gap whose open jumps
   beyond it (a gap is a candle like any other). Wick pokes never
   break. All levels come from body points (opens/closes), never
   wick extremes. */
function dirWords(dir) {
  if (dir === "up") return {
    trend: "uptrend", near: "Higher High", far: "Higher Low",
    beyond: "below", inside: "above", pattern: "higher highs and higher lows"
  };
  return {
    trend: "downtrend", near: "Lower Low", far: "Lower High",
    beyond: "above", inside: "below", pattern: "lower lows and lower highs"
  };
}

/* lineMode: the closes-only Line view (buildLineView). The same walk
   runs over closes-only swings and pseudo-candles; gap breaks and
   wick pokes cannot occur in that view and are never checked, so no
   gap or poke wording reaches Line-mode captions or explanations. */
function analyze(chart, lineMode) {
  var candles = chart.candles, segRanges = chart.segRanges;
  var totalSegs = segRanges.length;
  var lastIdx = candles.length - 1;
  var bySeg = {};
  chart.swingEvents.forEach(function (e) {
    (bySeg[e.seg] = bySeg[e.seg] || []).push(e);
  });

  /* Gap origin, for labels and gap narration: one extreme can be
     registered twice — as a segment-end swing AND as a gap swing —
     when a segment's end scan reaches across the junction and lands
     on the gap candle's own body point (the twin-swing case: e.g.
     chart c08pd9, where candle 19's 91.88 is segment 9's end swing
     and segment 10's gap swing at once). Which twin a control point
     happens to be built from must not decide how it reads: a far
     control whose extreme coincides with a gap swing — same candle,
     same price, same kind — sits at a gap price, so it carries the
     "(moved to gap price)" label and the gap narration either way. */
  var gapOrigin = {};
  chart.swingEvents.forEach(function (e) {
    if (e.gap) gapOrigin[e.idx + "|" + e.price + "|" + e.type] = true;
  });
  function gapPriced(sw) {
    return !!sw.gap || !!gapOrigin[sw.idx + "|" + sw.price + "|" + sw.type];
  }

  /* ---- unified swing-leg bookkeeping ----
     segRanges are body-run ranges: a recipe boundary or a counter-gap
     split can cut one swing leg into two ranges, and one range can
     carry two swings (a gap swing and its own end swing). The pattern
     engine reads SWING LEGS — the travel between consecutive surviving
     swings — so every narration that names a segment or counts
     segments since a break must read the same legs, or the captions
     disagree with the swings they describe (chart a450wv, Michael's
     catch, Oct 27, 2026: the post-break down leg runs candles 21–26 —
     the gap candle's body opens it — but its ranges are 21–22 and
     23–26, so the Summary called candles 21–22 "segment 1 since the
     break" and the replay called candles 23–26 "the third segment",
     dropping candles 21–22 from the leg entirely). The helpers below
     are that single source: a leg's candle span starts at the swing
     that launched it (the swing candle itself when the swing price is
     that candle's open-side body point — a gap swing at the gap edge —
     the candle after otherwise, the same convention the crossing
     windows scan from), and a range's leg is identified by the
     surviving swing its travel merges into. */
  var swingsFull = [chart.initialSwing].concat(chart.swingEvents);
  function legStartIdx(sw, maxIdx) {
    var i = sw.idx;
    var from = (candles[i] && candles[i].o === sw.price) ? i : i + 1;
    return Math.min(from, maxIdx);
  }
  /* Position in swingsFull of an episode's near-control snapshot —
     the dead trend's final extreme, the anchor post-break segments
     are counted from. -1 when it cannot be found. */
  function anchorPosOf(snap, dir) {
    var t = dir === "up" ? "high" : "low";
    for (var i = swingsFull.length - 1; i >= 0; i--) {
      var e = swingsFull[i];
      if (e.idx === snap.idx && e.price === snap.price && e.type === t) return i;
    }
    return -1;
  }
  /* The surviving swing a range's travel belongs to: its own end
     swing when it kept one; the later same-type swing its end swing
     merged into when the leg spans several ranges (the merged swing

        "live control points — nothing to move.");

          (early.pc.never

       teacher's doctrine: only counter-trend and control-affecting
       gaps are narrated. A gap WITH the move, inside an impulse, has
       no significance for the control points and is left alone, and
       a break frame's own caption already tells its gap story. */

          fcap += " Note the gap: candle " + (fi + 1) + " gapped " + (gSgn > 0 ? "up" : "down") +

            "extremes, the gapped open included.";
        }

       controls are set. Derived from the same ctrlLog entry the frame's
       lines come from, so the replay's trend readout always agrees

        "control point. No candle ever closed " + w.beyond + " the " + w.far + " at " +

          "formed " + uw.pattern + " — but the third segment was still running when the chart ended. " +
          "A new trend counts only once its third segment has ended and a fourth has begun, so the " +
          "market is in consolidation at the end of the chart.");
      } else {

          "once the third segment has ended and a fourth has begun, so no trend was ever " +

          " the controlling " + bw.far + " (" + fmt(b.level) + "), so the " + bw.trend +
          " died at its last control point. Only " + (counterSegs === 1 ? "one counter-segment" : "two counter-segments") +
          " followed — a new trend needs three directional segments — so the market is in " +
          "consolidation at the end of the chart.");
      } else {
        parts.push("Candle " + (b.idx + 1) + (b.gap ? " gapped " : " closed ") + bw.beyond +
          " the controlling " + bw.far + " (" + fmt(b.level) + "), so the " + bw.trend +
          " died at its last control point. The follow-through never strung together three directional segments into a " +
          "new trend, so the market is in consolidation at the end of the chart.");
      }

      parts.push("Price tried to trend " + (upTry ? "up" : "down") + ": an impulse, a " +
        "correction, then a second impulse — but that second impulse stalled at " +
        fmt(sw4.price) + ", short of a " + (upTry ? "higher high" : "lower low") +

        "segment: consolidation.");
    } else {

        "three directional segments there is no trend: consolidation.");

    var gw = dirWords(answer);
    parts.push("Note the gap: a gap counts as a segment all by itself — here it was the retracement, and it moved the " + gw.far +
      " to the gap price, " + fmt(gapEv[0].price) + " — the line the " + gw.trend +
      " then had to hold.");
  }

    var pw = dirWords(answer);

      "back " + pw.inside + " it — bodies, not wicks, decide a break.");

     closes against the leg, searched from the end of the segment
     that printed the swing — the same confirmation close the
     control points use. A gap swing's leg is the gap segment
     itself, so it takes the gap search above instead: same
     lifecycle, measured from the gap candle. -1 means the chart
     ends first, so the leg never becomes final. The renderers dash
     a leg until that close (and, at the end of the chart, for good
     when there is none), so a still-forming leg never looks
     identical to a finished one. */
  var legConfirm = [];
  swingsAll.forEach(function (sw) {
    if (sw.seg == null || sw.seg < 0 || !segRanges[sw.seg]) return;
    legConfirm.push([sw, sw.gap ? gapLegConfirm(sw)

  else refDir = swingsAll[swingsAll.length - 1].price >= swingsAll[0].price ? 1 : -1;

  return {
    answer: answer,
    explanation: parts.join(" "),
    steps: steps,
    frames: frames,
    finalLines: finalLines,
    swings: swingsAll,
    legConfirm: legConfirm,
    refDir: refDir,
    unfinished: unfinished ? unfinished.dir : null,
    lastBreakIdx: breaks.length ? breaks[breaks.length - 1].idx : -1
  };
}

  var bare = !!opts.bare;  // question phase: candles (and gap markers) only
  var lines = bare ? [] : (opts.lines || []);
  var lineMode = CANDLE_STYLE === "line";
  /* The right margin must fit the longest label in full — the fixed 118px
     clipped "Previous Lower High" / "Previous Higher High" at the edge. */
  var longestLabel = 0;
  lines.forEach(function (L) { longestLabel = Math.max(longestLabel, L.label.length); });
  var padR = Math.max(118, Math.ceil(longestLabel * 7.4) + 20);
  var W = 840, H = 400, padL = 10, padT = 14, padB = 24;
  var pw = W - padL - padR, ph = H - padT - padB;
  var mn = Infinity, mx = -Infinity, i, c;
  for (i = 0; i < n; i++) {
    if (lineMode) { mn = Math.min(mn, candles[i].c); mx = Math.max(mx, candles[i].c); }
    else { mn = Math.min(mn, candles[i].l); mx = Math.max(mx, candles[i].h); }
  }
  lines.forEach(function (L) { mn = Math.min(mn, L.price); mx = Math.max(mx, L.price); });

  function X(idx) { return padL + (idx + 0.5) * (pw / n); }

  CHART_GEOM[cid] = { candles: candles, n: n, W: W, H: H, padL: padL, padT: padT, pw: pw, ph: ph, mn: mn, mx: mx };
  out.push('<svg class="chart" data-cg="' + cid + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + (lineMode ? "Line chart" : "Candlestick chart") + '">');
  var g, gy;
  for (g = 0; g <= 4; g++) {
    gy = padT + ph * g / 4;
    out.push('<line x1="' + padL + '" y1="' + gy + '" x2="' + (padL + pw) + '" y2="' + gy + '" stroke="var(--line)" stroke-width="1"/>');
  }
  if (!bare && opts.highlight != null && opts.highlight >= 0) {
    out.push('<rect x="' + (X(opts.highlight) - cw * 1.15) + '" y="' + padT + '" width="' + (cw * 2.3) +
      '" height="' + ph + '" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.85"/>');
  }

     no wicks, drawn in the space between the two candles where a candle
     opens away from the previous close, so the gap reads as its own mark.
     The marker is coloured by significance: a WITH-trend gap — the same
     direction as the candles before and after it, inside an impulse —
     takes the colour of the surrounding move, so it merges into the move
     and reads as changing nothing; a COUNTER-trend gap takes the
     corrective orange, so it stands out as the kind that matters (it
     forms corrections, sets far controls at the gap price, or breaks
     trends). */
  if (!lineMode && SHOW_GAP_MARKERS) {
    for (i = 1; i < n; i++) {
      var gp = candles[i].o - candles[i - 1].c;
      if (Math.abs(gp) < 0.01) continue;
      var gx = (X(i - 1) + X(i)) / 2;
      var gyT = Y(Math.max(candles[i].o, candles[i - 1].c));
      var gyB = Y(Math.min(candles[i].o, candles[i - 1].c));
      var gDirM = gp > 0 ? 1 : -1;
      var withMove = Math.sign(candles[i - 1].c - candles[i - 1].o) === gDirM &&

      out.push('<rect x="' + (gx - cw * 0.42) + '" y="' + gyT + '" width="' + (cw * 0.84) + '" height="' +

    }

     full strength — purple, so the horizontal control lines can
     never be confused with the blue / orange segment lines; a dead

     printed but not final yet (replay pending windows only) — is a
     fine dashed line in a muted tone, so the active/final
     distinction reads at a glance. */
  lines.forEach(function (L) {

    if (L.cls === "active") { col = "var(--muted)"; dash = ' stroke-dasharray="2.5 3.5"'; wid = "1.4"; }

    else { col = C_GREY; dash = ' stroke-dasharray="7 4"'; wid = "1.6"; }
    var y = Y(L.price);
    out.push('<line x1="' + X(L.from) + '" y1="' + y + '" x2="' + (X(L.to) + cw * 0.6) + '" y2="' + y +
      '" stroke="' + col + '" stroke-width="' + wid + '"' + dash + ' opacity="0.95"/>');
  });
  /* swing overlay: last three segments (post-answer views only).
     opts.swings overrides the swing list — the candle replay passes
     only the swings printed so far, so the straight segment lines
     appear one candle at a time instead of all at once. */
  var sw = opts.swings || (q.result ? q.result.swings : []);
  /* Segment Summary mode (opts.summary): draw the COMPLETE final
     segment structure — every leg, not just the last three — with
     the legs already reached at full strength and the legs not yet
     reached lighter, as a roadmap. Only opacity changes between
     steps; geometry, colours and dashing are the final analysis's,
     exactly as the answered view draws them. */
  var summary = !!opts.summary;
  if (!bare && !lineMode && sw.length >= 2) {
    var pts = summary ? sw.slice() : sw.slice(-4);
    for (i = 0; i + 1 < pts.length; i++) {
      var A = pts[i], B = pts[i + 1];
      var upLeg = B.price > A.price;
      var impulsive = upLeg === (q.result.refDir > 0);
      var col2 = impulsive ? C_BLUE : C_ORANGE;
      /* A leg that is still forming — its extreme has printed but
         no candle has closed against it yet — is dashed, exactly
         like its control points; it turns solid at the same

         supplies the correction, the gap candle carries BOTH control

         HL/LH, and its close runs into the next segment, whose end
         swing is B and whose range opens on that same candle. The
         segment line therefore runs up (or down) that one candle's

         chord from A to B would leap off them at the confirmation

         generalized to a segment the gap gives birth to — is that
         the through-closes path IS this leg's final line: A, the

         deliberately NOT gated on the replay or on the leg being
         active, so the answered view and the Segment Summary draw
         the identical line — the confirmation close changes only

         unified on the through-closes path, not the replay alone

        candles[q.segRanges[B.seg].from] && candles[q.segRanges[B.seg].from - 1] &&

         extreme has printed but no candle has closed against it, so

         straight chord that cuts across the candles in between and
         reads as if it skipped them (Michael, Oct 25, 2026: a break

         from the old Lower Low straight to the last candle). This is

     no line at all until its extreme prints. Draw it dashed from
     the last printed swing to the segment's running body extreme —

             current one, touching the running extreme on the candle

             between and reads as if it skipped them (Michael,
             Oct 25, 2026). The finished gap-anchored leg above takes

             when this leg's swing prints, the overlay leg takes over
             in the same through-closes form while it stays active,

             confirmation close — unless the leg is gap-born, in

          var fpts = [X(fA.idx).toFixed(1) + "," + Y(fA.price).toFixed(1)];

            fpts.push(X(fx).toFixed(1) + "," + Y(fx === fExI ? fExP : candles[fx].c).toFixed(1));
          }

            out.push('<polyline points="' + fpts.join(" ") + '" fill="none" stroke="' + fCol +
              '" stroke-width="2.6" opacity="0.9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/>');
          } else {

               running extreme is exact — there is nothing to pass
               through. */
            out.push('<line x1="' + X(fA.idx) + '" y1="' + Y(fA.price) + '" x2="' + X(fExI) + '" y2="' + Y(fExP) +

    var NEUTRAL = "var(--muted)";
    if (bare) {

         dashed, until the swing prints and the span above takes

      var formA = null, formB = null;

        '" stroke="' + colr + '" stroke-width="1.3"' + op + "/>");

    }

  var labels = lines.map(function (L) {

  /* Where a control point's short label prints: clear of the candle

     point's (HL, LL) goes below the bottom of its wick — so the
     letters never sit on the candle body, where a low point's label
     used to land (Michael, Oct 25, 2026: c08pd9's HL printed on the
     tiny body at candle 19). The side is decided here and only here,
     from the label itself, so final (capital) and active (lowercase)
     labels follow the same rule in the answered view, the Segment Summary

  labels.forEach(function (it) {

    if (opts.abbr && L.abbr) {

         object by the frame builder) in a regular weight; a final
         point's is bold capitals (HH, HL, LL, LH). */

  for (i = 0; i < n; i++) {
    if (i % 5 === 0 || i === n - 1) {
      out.push('<text x="' + X(i) + '" y="' + (H - 7) + '" font-size="9.5" fill="var(--muted)" text-anchor="middle">' + (i + 1) + "</text>");
    }
  }
  /* draggable crosshair cursor: hidden until the reader drags or hovers
     over the chart; bindChartCursors() wires the pointer handlers. The
     readout itself is NOT drawn on the chart — it lives in the strip
     below (xh-readout), so it can never cover a candle. */
  out.push('<g class="xhair" style="display:none" pointer-events="none">' +
    '<rect class="xh-hl" y="' + padT + '" height="' + ph + '" fill="var(--accent)" opacity="0.10"/>' +
    '<line class="xh-v" y1="' + padT + '" y2="' + (padT + ph) + '" stroke="var(--accent)" stroke-width="1.2"/>' +
    '<line class="xh-h" x1="' + padL + '" x2="' + (padL + pw) + '" stroke="var(--accent)" stroke-width="1.2"/>' +
    '<circle class="xh-dot" r="3.2" fill="var(--accent)"/>' +
    "</g>");
  out.push("</svg>");
  out.push('<div class="xh-readout" data-xh="' + cid + '" aria-live="off">' +
    '<span class="xh-ro-hint">Drag or hover across the chart to read a candle here.</span>' +
    '<span class="xh-ro-1"></span><span class="xh-ro-2"></span><span class="xh-ro-3"></span></div>');
  return out.join("");
}

/* ---------------- draggable chart cursor ----------------
   Dragging (or, with a mouse, hovering) over any chart shows a vertical
   line snapped to the nearest candle and a horizontal line at the
   pointer's height. The values — candle number, OHLC, and the exact
   price under the horizontal line — are written to the readout strip
   docked under the chart, never onto the chart itself, so no candle
   is ever hidden behind them. */
function bindChartCursors() {
  var svgs = app.querySelectorAll("svg.chart[data-cg]");
  for (var i = 0; i < svgs.length; i++) {
    if (svgs[i].getAttribute("data-bound")) continue;
    svgs[i].setAttribute("data-bound", "1");
    attachCursor(svgs[i], CHART_GEOM[svgs[i].getAttribute("data-cg")]);
  }
}
function attachCursor(svg, G) {
  if (!G) return;
  var g = svg.querySelector(".xhair");
  if (!g) return;
  var hl = g.querySelector(".xh-hl"), vl = g.querySelector(".xh-v"), hz = g.querySelector(".xh-h"),
      dot = g.querySelector(".xh-dot");
  var strip = svg.parentNode ? svg.parentNode.querySelector('.xh-readout[data-xh="' + svg.getAttribute("data-cg") + '"]') : null;
  var roHint = strip ? strip.querySelector(".xh-ro-hint") : null,
      ro1 = strip ? strip.querySelector(".xh-ro-1") : null,
      ro2 = strip ? strip.querySelector(".xh-ro-2") : null,
      ro3 = strip ? strip.querySelector(".xh-ro-3") : null;
  function update(e) {
    var r = svg.getBoundingClientRect();
    if (!r.width || !r.height) return;
    var sx = (e.clientX - r.left) * (G.W / r.width);
    var sy = (e.clientY - r.top) * (G.H / r.height);
    var slot = G.pw / G.n;
    var idx = Math.floor((sx - G.padL) / slot);
    if (idx < 0) idx = 0;
    if (idx > G.n - 1) idx = G.n - 1;
    var cx = G.padL + (idx + 0.5) * slot;
    var cy = Math.max(G.padT, Math.min(G.padT + G.ph, sy));
    var price = G.mx - (cy - G.padT) / G.ph * (G.mx - G.mn);
    var c = G.candles[idx];
    g.style.display = "";
    hl.setAttribute("x", G.padL + idx * slot); hl.setAttribute("width", slot);
    vl.setAttribute("x1", cx); vl.setAttribute("x2", cx);
    hz.setAttribute("y1", cy); hz.setAttribute("y2", cy);
    dot.setAttribute("cx", cx); dot.setAttribute("cy", cy);
    if (ro1) {
      if (roHint) roHint.style.display = "none";
      ro1.textContent = "Candle " + (idx + 1) + " of " + G.n;
      ro2.textContent = "O " + fmt(c.o) + " · H " + fmt(c.h) + " · L " + fmt(c.l) + " · C " + fmt(c.c);
      ro3.textContent = "Cursor price: " + fmt(price);
    }
  }
  svg.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (svg.setPointerCapture) { try { svg.setPointerCapture(e.pointerId); } catch (err) {} }
    update(e);
  });
  svg.addEventListener("pointermove", function (e) {
    if (e.pointerType === "mouse" || e.buttons > 0) update(e);
  });
}

function copyChartId(id, btn) {

/* ---------------- recently viewed charts ----------------
   A short history of the charts the reader has viewed — every
   chart shown in a set and every chart opened by ID — most recent
   first, deduplicated (re-viewing a chart moves it to the top) and
   capped at 20 (Michael, Oct 25, 2026: a way "to go back if you
   missed one that you want to see but you forgot to record the
   chart number"). The list is kept in localStorage so it survives
   reloads and works the same in the hosted page, the Netlify copy
   and the standalone file opened locally. Every storage call is
   guarded: where localStorage is blocked or unavailable the
   history simply lives for the session instead of erroring. */
var HISTORY_KEY = "trendQuiz.recentCharts.v1";
var chartHistory = null;
function loadHistory() {
  if (chartHistory) return chartHistory;
  chartHistory = [];
  try {
    var raw = window.localStorage ? window.localStorage.getItem(HISTORY_KEY) : null;
    if (raw) {
      var arr = JSON.parse(raw);
      if (Array.isArray(arr)) {
        chartHistory = arr.filter(function (e) { return e && typeof e.id === "string"; }).slice(0, 20);
      }
    }
  } catch (e) { /* storage unavailable: session-only history */ }
  return chartHistory;
}
function saveHistory() {
  try {
    if (window.localStorage) window.localStorage.setItem(HISTORY_KEY, JSON.stringify(chartHistory || []));
  } catch (e) { /* storage unavailable: nothing persists */ }
}
function rememberChart(id) {
  if (!id) return;
  var h = loadHistory().filter(function (e) { return e.id !== id; });
  h.unshift({ id: id, t: Date.now() });
  chartHistory = h.slice(0, 20);
  saveHistory();
}
function relTime(t) {
  var s = Math.max(0, Math.floor((Date.now() - (t || 0)) / 1000));
  if (s < 90) return "just now";
  var m = Math.floor(s / 60);
  if (m < 60) return m + " min ago";
  var h = Math.floor(m / 60);
  if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  var d = Math.floor(h / 24);
  return d + (d === 1 ? " day ago" : " days ago");
}
/* The Recently viewed dropdown in the start screen's Replay-a-chart
   box. With an empty history it renders disabled and muted — a
   placeholder, not an empty box. Choosing an entry loads that chart
   through the same practice-round path as the Replay chart button. */
function recentHtml() {
  var h = loadHistory();
  var head = '<div class="replayrow"><span class="styleopt-label">Recently viewed</span>';
  if (!h.length) {
    return head +
      '<select class="txtin" id="recentSel" disabled aria-label="Recently viewed charts">' +
      '<option value="">No charts viewed yet</option></select>' +
      '<button class="btn" id="recentClear" disabled>Clear</button></div>';
  }
  var opts = '<option value="">Choose a chart…</option>' + h.map(function (e) {
    return '<option value="' + esc(e.id) + '">#' + esc(e.id) + " · " + relTime(e.t) + "</option>";
  }).join("");
  return head +
    '<select class="txtin" id="recentSel" aria-label="Recently viewed charts">' + opts + "</select>" +
    '<button class="btn" id="recentClear">Clear</button></div>';
}
